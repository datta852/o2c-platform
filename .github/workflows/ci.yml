name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://o2c_test:ci_only_password@localhost:5432/o2c_platform_test
      O2C_TEST_DATABASE_URL: postgresql+psycopg://o2c_test:ci_only_password@localhost:5432/o2c_platform_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: o2c_platform_test
          POSTGRES_USER: o2c_test
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U o2c_test -d o2c_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run business and migration tests
        run: python -m unittest discover -s tests -v
